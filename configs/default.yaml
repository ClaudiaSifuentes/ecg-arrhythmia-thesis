model:
  type: "cnn1d"
  parameters:
    num_classes: 3
    input_size: 250
    dropout: 0.5

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50

evaluation:
  threshold: 0.5
  min_duration: 5

logging:
  level: "INFO"
  log_file: "logs/project.log"

paths:
  data: "data/"
  logs: "logs/"
  configs: "configs/"