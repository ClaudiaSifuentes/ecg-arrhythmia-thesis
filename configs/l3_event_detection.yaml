model:
  type: "event_detection"
  parameters:
    anomaly_score_threshold: 0.5
    min_event_duration: 5
    consecutive_vb_threshold: 3

logging:
  log_file: "logs/event_detection.log"
  log_level: "INFO"

evaluation:
  sensitivity_threshold: 0.8
  specificity_threshold: 0.8

output:
  save_results: true
  results_file: "results/event_detection_results.csv"