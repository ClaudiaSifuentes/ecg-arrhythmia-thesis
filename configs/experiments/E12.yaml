# Official baseline: E12 recipe under the corrected CV protocol.
# Focal Loss γ=2, alpha=[1,8,3], no SMOTE, Adam 5e-4 / wd 1e-4, batch 256,
# max 50 epochs, patience 8 (early stopping on an INNER patient-wise val split).
exp_id: E12
data_dir: data/processed/mitbih_aami3
model: {dropout: 0.5, use_rr: true}
loss: {type: focal, gamma: 2.0, alpha: [1.0, 8.0, 3.0], label_smoothing: 0.0}
optim: {lr: 0.0005, weight_decay: 0.0001, batch_size: 256, max_epochs: 50, patience: 8, lr_patience: 7, lr_factor: 0.5}
cv: {n_splits: 5, split_seed: 42, inner_val_frac_splits: 5}
features: {rr_set: base}
augment: null
# Decision rule shared by CV, test and inference (src/training/decision.py).
decision: {t_sveb: 0.24, t_veb: null}
seeds: [0, 1, 2]
num_threads: 1
