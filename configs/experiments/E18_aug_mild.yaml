# ONE change vs E17_aug: milder augmentation, to keep E17's robustness without
# its clean-signal cost on MIT-BIH (E17: SVEB PPV -0.040 on clean MIT).
# p 0.5 -> 0.25 and no time shift (shift ±22 ms had no effect on either model).
# Compared against E16 (clean) and E17 (robustness).
inherit: E17_aug.yaml
exp_id: E18_aug_mild
augment: {p: 0.25, gauss_std: 0.04, baseline_amp: 0.15, shift_max: 0, scale: 0.1}
